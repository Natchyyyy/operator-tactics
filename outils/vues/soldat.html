<!doctype html><html><head><meta charset="utf-8"><title>Soldat Meshy</title><style>body{margin:0;background:#222}canvas{display:block}</style></head><body>
<script src="../../web/three.min.js"></script><script src="../../web/gltf.js"></script>
<script>
// Planche de contrôle : le soldat Meshy figé à un instant de plusieurs animations (vérification du chargement et des poses).
const W = 1600, H = 900, r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
const sc = new THREE.Scene(); sc.background = new THREE.Color(0x3a4248);
sc.add(new THREE.HemisphereLight(0xffffff, 0x404040, 1.6)); const d = new THREE.DirectionalLight(0xfff0d8, 2.4); d.position.set(3, 5, 4); sc.add(d);
const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 100); cam.position.set(0, 3.2, 13); cam.lookAt(0, 1.2, 0);
const q = new URLSearchParams(location.search), names = (q.get('a') || '').split(',').filter(Boolean), t = parseFloat(q.get('t') || '0.4');
new THREEX.GLTFLoader().load('../../art/meshy/soldat_web.glb', (g) => {
  window.G = g; const clips = names.length ? names.map(n => g.animations.find(c => c.name === n)) : g.animations.slice(0, 8);
  clips.forEach((clip, i) => {
    const s = (i === 0) ? g.scene : cloneSkinned(g.scene); const col = i % 6, row = Math.floor(i / 6);
    s.position.set((col - 2.5) * 1.6, 0, -row * 2.2); sc.add(s);
    if (clip) { const m = new THREE.AnimationMixer(s); m.clipAction(clip).play(); m.setTime(t * clip.duration); }
  });
  r.render(sc, cam); window.PRET = true;
}, undefined, (e) => { document.title = 'ERR ' + e; window.PRET = true; });
function cloneSkinned(src) {   // copie d'un personnage à squelette : os recréés et réassociés par nom
  const c = src.clone(true), bones = {}; c.traverse(o => { if (o.isBone) bones[o.name] = o; });
  c.traverse(o => { if (o.isSkinnedMesh) { const sk = o.skeleton; o.bind(new THREE.Skeleton(sk.bones.map(b => bones[b.name]), sk.boneInverses), o.bindMatrix); } });
  return c;
}
</script></body></html>
