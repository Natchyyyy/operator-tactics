<!doctype html><html><head><meta charset="utf-8"><title>Mesures des animations</title><style>body{margin:8px;background:#222;color:#ddd;font:12px monospace;white-space:pre}</style></head><body>
<script src="../../web/three.min.js"></script><script src="../../web/figure.js"></script><script src="../../web/gltf.js"></script><script src="../../web/modeles/soldat.js"></script><script src="../../web/modeles/gign.js"></script><script src="../../web/modeles/decor.js"></script><script src="../../web/modeles3d.js"></script><script src="../../web/soldat3d.js"></script>
<script>
// Vitesse « naturelle » de chaque cycle de locomotion : pendant l'appui, le pied recule par rapport au bassin à la vitesse du
// sol. On échantillonne le cycle, on garde les instants où le pied est au plus bas (appui) et on moyenne sa vitesse
// horizontale relative au bassin. Donne aussi la direction de marche (dans le repère du corps) et la hauteur des pieds.
OT.Soldat3D.whenReady(() => {
  const out = {};
  for (const nom in OT.Soldat3D.modeles) {
    const f = OT.Soldat3D.create({ modele: nom, weapon: 'carbine' }); out[nom] = {};
    const b = (n) => f.body.getObjectByName('mixamorig:' + n) || f.body.getObjectByName('mixamorig' + n);
    const hips = b('Hips'), feet = [b('LeftToeBase'), b('RightToeBase')];
    for (const clip of ['Walking', 'Walk_Fight_Forward', 'Walk_Aim', 'Running', 'RunFast', 'Run_and_Shoot', 'Cautious_Crouch_Walk_Forward']) {
      if (!f.clips[clip]) continue;
      const mixer = new THREE.AnimationMixer(f.body), act = mixer.clipAction(f.clips[clip]), dur = f.clips[clip].duration, N = 120; act.play();
      const P = feet.map(() => []), H = [];
      for (let i = 0; i < N; i++) {
        mixer.setTime((i / N) * dur); f.body.updateMatrixWorld(true);
        const hp = hips.getWorldPosition(new THREE.Vector3()); H.push(hp);
        feet.forEach((ft, k) => P[k].push(ft.getWorldPosition(new THREE.Vector3())));
      }
      let sv = 0, n = 0, dir = new THREE.Vector3();
      feet.forEach((ft, k) => {
        const ys = P[k].map(p => p.y), ymin = Math.min(...ys);
        for (let i = 0; i < N; i++) {
          if (P[k][i].y > ymin + 0.03) continue;
          const j = (i + 1) % N, dt = dur / N;
          const r0 = P[k][i].clone().sub(H[i]), r1 = P[k][j].clone().sub(H[j]); const v = r1.sub(r0).divideScalar(dt); v.y = 0;
          sv += v.length(); n++; dir.add(v);
        }
      });
      const v = n ? sv / n : 0; dir.normalize(); mixer.stopAllAction(); mixer.uncacheRoot(f.body);
      out[nom][clip] = { vitesse: +v.toFixed(2), duree: +dur.toFixed(2), direction: [+dir.x.toFixed(2), +dir.z.toFixed(2)], yMinPieds: +Math.min(...P[0].map(p => p.y), ...P[1].map(p => p.y)).toFixed(3) };
    }
  }
  // chutes : où finissent la tête et les pieds (repère du soldat : +Z devant), pour choisir une chute qui ne traverse pas un mur
  for (const nom in OT.Soldat3D.modeles) {
    const f = OT.Soldat3D.create({ modele: nom, weapon: 'carbine' });
    const b = (n) => f.body.getObjectByName('mixamorig:' + n) || f.body.getObjectByName('mixamorig' + n);
    for (const clip of ['Shot_and_Fall_Forward', 'Shot_in_the_Back_and_Fall']) {
      const mixer = new THREE.AnimationMixer(f.body), act = mixer.clipAction(f.clips[clip]); act.play(); mixer.setTime(f.clips[clip].duration - 0.01); f.body.updateMatrixWorld(true);
      const P = (n) => { const v = b(n).getWorldPosition(new THREE.Vector3()); return [+v.x.toFixed(2), +v.y.toFixed(2), +v.z.toFixed(2)]; };
      out[nom][clip] = { tete: P('Head'), bassin: P('Hips'), piedG: P('LeftFoot'), piedD: P('RightFoot'), mainD: P('RightHand') };
      mixer.stopAllAction(); mixer.uncacheRoot(f.body);
    }
  }
  document.body.textContent = JSON.stringify(out, null, 1); window.RES = out; window.PRET = true;
});
</script></body></html>
